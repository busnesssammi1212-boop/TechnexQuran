<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="title"><span class="logo">☪</span><div><h1>Quran Listener</h1><p>114 Surahs · Listen anywhere</p></div></div>
    <select id="reciter" title="Reciter"></select>
  </header>

  <div class="search">
    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 4a7 7 0 100 14 7 7 0 000-14zm9 16l-4-4"/></svg>
    <input id="q" type="text" placeholder="Search: baqarah, yasin, 36, الكهف…" autocomplete="off" autofocus>
    <span id="count"></span>
  </div>

  <main id="list"><div class="msg">Loading surahs…</div></main>

  <footer id="player" class="hidden">
    <div class="now"><b id="pTitle">—</b><span id="pSub"></span></div>
    <input id="seek" type="range" min="0" max="100" value="0" step="0.1">
    <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    <div class="controls">
      <select id="rate" title="Speed">
        <option value="0.75">0.75x</option><option value="1" selected>1x</option>
        <option value="1.25">1.25x</option><option value="1.5">1.5x</option>
      </select>
      <button id="prev" title="Previous">⏮</button>
      <button id="toggle" class="main" title="Play / Pause">▶</button>
      <button id="next" title="Next">⏭</button>
      <input id="vol" type="range" min="0" max="1" step="0.05" value="1" title="Volume">
    </div>
  </footer>

  <script src="reciters.js"></script>
  <script src="popup.js"></script>
</body>
</html>
